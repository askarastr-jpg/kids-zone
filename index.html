<!DOCTYPE html><html dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kids Zone</title><style>body{font-family:system-ui;background:linear-gradient(135deg,#667eea,#764ba2);margin:0;padding:16px} .card{background:#fff;border-radius:22px;padding:20px;max-width:400px;margin:auto} h1{text-align:center;color:#764ba2} input{width:100%;padding:14px;margin:7px 0;border:2px solid #eee;border-radius:12px;font-size:16px;box-sizing:border-box} button{width:100%;padding:14px;border:none;border-radius:12px;font-size:17px;font-weight:bold;margin-top:8px} .g{background:#25D366;color:#fff} .r{background:#ff3b30;color:#fff} .item{background:#f5f5ff;padding:10px;border-radius:10px;margin-top:6px;display:flex;justify-content:space-between}</style></head><body><div class="card"><h1>🎈 Kids Zone 🎈</h1><div id="tt" style="text-align:center;font-size:48px;font-weight:900;color:#764ba2">00:00</div><input id="n" placeholder="رقم الطفل"><input id="a" placeholder="اسم الطفل"><input id="p" placeholder="رقم ولي الامر 9647xxxx"><button class="r" onclick="s()">⏱️ ابدأ الوقت</button><button class="g" onclick="w()">💬 حفظ + واتساب</button><div id="l"></div></div><script>let k=JSON.parse(localStorage.getItem('k')||'[]'),sc=0,iv;function r(){l.innerHTML=k.map(x=>`<div class=item><b>${x.n}-${x.a}</b><span>${x.t}</span></div>`).join('')}function s(){clearInterval(iv);sc=0;iv=setInterval(()=>{sc++;let m=String(Math.floor(sc/60)).padStart(2,'0'),ss=String(sc%60).padStart(2,'0');tt.innerText=m+':'+ss},1000)}function w(){let N=n.value,A=a.value,P=p.value;if(!N||!A||!P)return alert('املأ كل الحقول');let T=tt.innerText;k.push({n:N,a:A,t:T});localStorage.setItem('k',JSON.stringify(k));r();let msg=`مرحبا الطفل ${A} رقم ${N} وقته ${T} - Kids Zone`;open(`https://wa.me/${P.replace(/[^0-9]/g,'')}?text=${encodeURIComponent(msg)}`)}r()</script></body></html>
